services:
  - type: web
    name: supportsalecoo
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    autoDeploy: false
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        sync: false
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_URL
        sync: false
      - key: DB_EMULATE_PREPARES
        value: "true"
      - key: DB_PERSISTENT
        value: "false"
      - key: CACHE_STORE
        value: file
      - key: SESSION_DRIVER
        value: cookie
      - key: SESSION_ENCRYPT
        value: "true"
      - key: SESSION_SECURE_COOKIE
        value: "true"
      - key: SESSION_SAME_SITE
        value: lax
      - key: SANCTUM_STATEFUL_DOMAINS
        sync: false
      - key: BUDGET_STORAGE_DISK
        value: supabase
      - key: BUDGET_STORAGE_DRIVER
        value: supabase
      - key: REDBOOK_EMBEDDING_BACKEND
        value: tfidf
      - key: SUPABASE_STORAGE_ENDPOINT
        sync: false
      - key: SUPABASE_STORAGE_REGION
        value: ap-southeast-1
      - key: SUPABASE_STORAGE_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_STORAGE_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_STORAGE_BUCKET
        value: erp-budget-analysis
      - key: ERP_EMAIL_NOTIFICATIONS_ENABLED
        value: "true"
      - key: WORKFLOW_EMAIL_TRANSPORT
        value: gmail_api
      - key: GMAIL_CLIENT_ID
        sync: false
      - key: GMAIL_CLIENT_SECRET
        sync: false
      - key: GMAIL_REFRESH_TOKEN
        sync: false
      - key: GMAIL_SENDER
        value: sukirin.valorhealth@gmail.com
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
