[www]
; Free Render instances have 512 MB RAM. Start workers only when requests arrive
; so idle PHP processes do not compete with nginx and the Python budget worker.
pm = ondemand
pm.max_children = 5
pm.process_idle_timeout = 10s

; Recycle long-lived workers to release memory accumulated by heavy imports,
; exports, PDF generation, and dashboard requests.
pm.max_requests = 200
request_terminate_timeout = 120s

; Forward worker errors to Render logs for easier diagnosis.
catch_workers_output = yes
decorate_workers_output = no
